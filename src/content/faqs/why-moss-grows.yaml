question: "Why does moss grow on my roof?"
answer: >-
  Moss needs shade and consistent moisture to establish itself, which is
  why it shows up most on north-facing slopes, roofs under heavy tree
  cover, and areas that stay damp between rain events. Asphalt shingles
  give it a rougher surface to grip than metal or tile, which is part of
  why it's such a common issue in Western Washington.
