question: "Is roof cleaning safe for asphalt shingles?"
answer: >-
  It depends on the method. High-pressure washing can strip the granules off
  asphalt shingles and shorten their lifespan. We use low-pressure treatment
  methods specifically to avoid that kind of damage.
