question: "What should a roof replacement estimate include?"
answer: >-
  A useful estimate should spell out the specific material and quality being
  installed, the tear-off scope, how decking damage would be handled if
  found, a realistic project timeline, and what's bundled into the price,
  such as cleanup and disposal. If a quote is vague on any of those, ask
  before you sign.
