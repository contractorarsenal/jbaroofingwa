question: "How do I prepare for a roof replacement?"
answer: >-
  Move vehicles away from the driveway and work area, clear patio furniture
  or fragile items near the house, and move valuables stored in the attic
  or near exterior walls. Tear-off and installation days are loud, so plan
  around that, and keep pets and kids away from the work zone until crews
  are finished for the day.
