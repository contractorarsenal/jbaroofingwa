question: "Why is moss more common on Snohomish County roofs?"
answer: >-
  Heavier tree cover across much of Snohomish County means more shade and
  more organic debris landing on the roof, both of which help moss take
  hold faster than on more open, sun-exposed roofs. It's a bigger factor
  here than in less wooded parts of our service area.
