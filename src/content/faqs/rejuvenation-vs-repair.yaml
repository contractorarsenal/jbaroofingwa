question: "How is rejuvenation different from a repair or replacement?"
answer: >-
  A repair fixes a specific damaged area. A replacement is a full new
  roofing system. Rejuvenation is a treatment aimed at extending the usable
  life of an aging roof that isn't yet failing, when the underlying
  structure is still sound.
