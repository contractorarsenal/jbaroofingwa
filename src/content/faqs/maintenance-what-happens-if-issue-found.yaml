question: "What happens if you find a problem during a maintenance visit?"
answer: >-
  We'll point it out, show you photos, and explain what it is and how urgent
  it is. Some issues are minor enough to note and monitor; others are worth
  scheduling a repair for. Either way, we're not going to pressure you into
  work the roof doesn't need during a routine maintenance visit.
