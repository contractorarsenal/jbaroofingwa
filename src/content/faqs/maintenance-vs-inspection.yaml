question: "Does roof maintenance include a full inspection?"
answer: >-
  A maintenance visit includes a general look at the roof's condition while
  we clean and clear debris, but it isn't the same as a dedicated inspection.
  If you specifically need documentation of the roof's condition, such as
  before buying a home or filing an insurance claim, book an inspection
  instead of or in addition to maintenance.
