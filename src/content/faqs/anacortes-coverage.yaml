question: "Does JBA take roofing jobs at my address in Anacortes?"
answer: >-
  JBA extends its King and Snohomish County service into parts of Skagit
  County, and coverage isn't uniform across the whole county. Send your
  address and JBA confirms whether it covers your specific area before
  anything else. If your address is on another island or outside the city of
  Anacortes, ask before relying on this page.
