question: "Is my leak an emergency, or can it wait?"
answer: >-
  If water is actively coming into the house, treat it as urgent. Call us or
  start a repair request right away so we can prioritize getting eyes on it.
  If it's a stain that isn't growing, it can typically wait for a scheduled
  inspection, though it's still worth having looked at soon.
