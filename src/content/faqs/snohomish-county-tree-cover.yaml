question: "Does heavy tree cover mean I need roof service more often?"
answer: >-
  It can. Properties with a lot of overhanging trees tend to collect debris
  and moss faster, which is why some Snohomish County homeowners schedule
  cleaning or maintenance more than once a year. We can give you a specific
  recommendation once we've seen the property.
