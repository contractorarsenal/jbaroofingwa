question: "Do I need an inspection if my roof isn't leaking?"
answer: >-
  Not leaking doesn't necessarily mean nothing's wrong. Issues like lifted
  flashing, granule loss, or moss holding moisture against the deck can
  develop before a leak shows up inside the house. An inspection is also
  useful just to confirm a sound roof is still in good shape, not only to
  chase down a problem.
