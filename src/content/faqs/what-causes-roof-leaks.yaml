question: "What causes a roof to leak?"
answer: >-
  Most leaks come from failed flashing around a chimney or vent, a roof
  penetration that was never properly sealed, missing or damaged shingles,
  poor drainage, or storm damage. Moss and debris holding water against
  the roof deck longer than it was built to handle is another common
  factor in Western Washington specifically.
