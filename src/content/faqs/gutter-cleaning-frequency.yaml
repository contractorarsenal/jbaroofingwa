question: "How often should I have my gutters cleaned in the Pacific Northwest?"
answer: >-
  With heavy tree cover common across King and Snohomish counties, we
  generally recommend at least once a year, often in fall after most leaves
  have dropped. Properties with a lot of overhanging trees may need it twice a
  year.
