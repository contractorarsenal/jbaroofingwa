question: "How is metal roofing different from asphalt shingles?"
answer: >-
  Metal generally offers a longer service-life potential and lower routine
  maintenance, but costs more upfront and requires a specific installation
  technique. Asphalt shingles cost less upfront, are widely understood by
  roofing crews, and are usually simpler to repair individually if a section
  is damaged.
