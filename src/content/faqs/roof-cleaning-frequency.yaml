question: "How often should a roof be cleaned?"
answer: >-
  It depends on tree cover and how much moss or debris the roof typically
  collects. Roofs with heavy shade or overhanging trees may need cleaning
  more often than roofs with more sun exposure. We can give you a specific
  recommendation after taking a look.
