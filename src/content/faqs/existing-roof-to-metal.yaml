question: "Can an existing shingle roof be replaced with metal?"
answer: >-
  In most cases, yes. It's a full tear-off and replacement rather than an
  overlay, since a metal system has different installation requirements than
  asphalt shingles. We'll confirm the specifics for your roof during an
  inspection.
