question: "Can moss damage shingles?"
answer: >-
  Yes, over time. As moss grows it can lift shingle edges and work its way
  underneath them, giving water a path it wouldn't otherwise have. Left
  long enough, that trapped moisture can lead to decking damage, which
  turns a cleaning job into a repair.
