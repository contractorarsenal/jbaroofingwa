question: "How is roof maintenance different from roof cleaning?"
answer: >-
  Roof cleaning removes moss, algae, and debris from the roof surface.
  Maintenance is broader: it includes cleaning, but also checking flashing,
  vents, gutters, and general condition so small issues get caught early. If
  all you need is moss removed, cleaning alone may be enough. If you want a
  fuller check of how the roof is holding up, maintenance is the better fit.
