question: "Can shingles be replaced during a wet Washington winter?"
answer: >-
  It depends on the weather and on the shingle manufacturer's installation
  requirements. Ask how both affect the schedule: what conditions the
  installer needs to work in, how rain days are handled, and how you'll be
  told if the timeline changes.
