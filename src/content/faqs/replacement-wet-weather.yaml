question: "Can shingles be replaced during a wet Washington winter?"
answer: >-
  Asphalt shingles are normally installed on dry decking and in dry conditions,
  because moisture trapped under new roofing can cause problems later. Wet
  weather can delay exterior work, so ask how the proposed schedule accounts
  for rain days and what happens to the timeline if the weather turns.
