question: "Do I need a permit to replace my roof?"
answer: >-
  Most jurisdictions in King, Snohomish, and Skagit counties require a permit
  for a full roof tear-off and replacement, though requirements and thresholds
  vary by city. Minor repairs typically don't require one. We confirm the
  specific requirement for your address and handle the permitting process as
  part of a replacement project.
