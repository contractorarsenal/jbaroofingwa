question: "What happens if damaged decking is found during a roof replacement?"
answer: >-
  Damaged or rotted decking needs to be replaced before new roofing goes
  down, since the roofing material sits directly on the deck. Decking
  condition often can't be fully confirmed until the old roof is removed,
  so we show you what we find before proceeding, rather than deciding for
  you or adding a surprise line to the final invoice.
