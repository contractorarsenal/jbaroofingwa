question: "What is roof rejuvenation?"
answer: >-
  Roof rejuvenation is a way to extend the usable life of an aging roof that
  isn't yet at the point of needing a full replacement. It's not the right
  fit for every roof, we'll assess your specific roof and give you a
  straight answer on whether it's a realistic option.
