question: "Can missing shingles be repaired without replacing the whole roof?"
answer: >-
  Yes, in most cases. Missing or damaged shingles in a specific area can
  typically be replaced without touching the rest of the roof, as long as
  matching material is available and the surrounding roofing is still in
  good condition. Widespread missing shingles across the roof point toward
  a bigger conversation.
