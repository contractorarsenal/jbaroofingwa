question: "Why does rain affect King County roofs so much?"
answer: >-
  Consistent rain and moisture are the biggest factor in how roofs age
  around King County, especially on shaded lots that don't dry out between
  storms. Over time that moisture is what turns a small issue, like a lifted
  shingle, into a bigger problem if it isn't caught.
