question: "Does roof cleaning guarantee my roof won't need repairs?"
answer: >-
  No. Cleaning removes moss and buildup and helps prevent the damage that
  moss can cause over time, but it doesn't repair existing damage or
  guarantee a specific roof lifespan. If cleaning reveals a problem
  underneath, we'll tell you.
