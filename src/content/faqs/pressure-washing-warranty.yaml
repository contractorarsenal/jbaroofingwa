question: "Will pressure washing damage my roof or void the warranty?"
answer: >-
  Standard high-pressure washing can strip the protective granules off asphalt
  shingles, which shortens their lifespan and can affect manufacturer warranty
  coverage. We use low-pressure treatment methods for moss and algae removal
  instead, specifically to avoid that kind of damage.
