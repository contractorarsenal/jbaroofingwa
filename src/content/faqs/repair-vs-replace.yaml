question: "How do I know if I need a repair or a full replacement?"
answer: >-
  It depends on the extent of the damage and the age of the roof. A single
  damaged area on a roof with a lot of life left is usually a repair. Widespread
  wear, repeated repairs in the same spots, or a roof already near the end of
  its expected lifespan usually points toward replacement. We'll give you a
  straight answer after inspecting it, not a default toward the bigger job.
